<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>我的價格紀錄｜Step 13.9.7.29</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;max-width:900px;margin:auto;padding:16px;background:#f3f5f7;color:#263442}button,input,textarea{font:inherit;border-radius:10px;padding:10px;border:1px solid #d8dee6;box-sizing:border-box}input,textarea{width:100%;margin:4px 0 10px}button{border:0;font-weight:700;cursor:pointer}.primary{background:#176da5;color:#fff}.secondary{background:#e7edf2;color:#263442}.danger{background:#c9362b;color:#fff}.muted{color:#68727d}.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}.card{background:#fff;border:1px solid #d8dee6;border-radius:14px;padding:14px;margin:10px 0}.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-box{background:#fff;border-radius:18px;padding:20px;width:min(560px,100%);max-height:88vh;overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:120px}.lookup-result{background:#f0f6fb;border:1px solid #c9dfef;padding:12px;border-radius:12px}.alias-row{display:flex;gap:8px;margin:6px 0}.alias-row input{margin:0}.alias-row button{width:44px}.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.photo-actions button{min-height:48px}.photo-preview{max-width:180px;max-height:180px;display:block;object-fit:contain;border:2px solid #263442;border-radius:8px;margin:8px 0}.product{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #d8dee6;border-radius:14px;padding:14px;margin:10px 0}.product-thumb{width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px dashed #9eb2c0;border-radius:8px;background:#f8fbfd;color:#68727d;font-size:.75rem;text-align:center;padding:4px}.product-thumb img{width:100%;height:100%;object-fit:contain;border:none;border-radius:6px}.product-info{flex:1;min-width:0}.product-name{font-weight:700;margin:0 0 4px}.product-meta{font-size:.9rem;color:#68727d;margin:2px 0}.notice{padding:10px;border-radius:10px;background:#f0f6fb;border:1px solid #c9dfef}.error{background:#fff0ef;border-color:#efb3ad}.success{background:#ecf9ef;border-color:#abd9b5}nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d8dee6;display:flex;justify-content:space-around;padding:8px}nav button{background:transparent;color:#68727d}nav button.active{color:#176da5;background:#e7edf2}main{padding-bottom:70px}@media(max-width:560px){.photo-actions{grid-template-columns:1fr}.row{display:block}}</style></head><body><main><section id="page-scan"><h1>價格查詢</h1><div class="notice"><strong>Step 13.9.7.29｜列表刪除、固定照片框、最高最低價</strong><br>可依條碼查詢商品名稱、品牌與圖片；資料仍可在儲存前修改。</div><div class="row"><div><label>商品條碼</label><input id="barcode" inputmode="numeric" placeholder="輸入 8–14 位數字條碼"></div><div style="align-self:end"><button class="primary" id="searchBtn">查詢商品</button></div></div><p id="status" class="muted"></p></section><section id="page-list" class="hidden"><h2>商品列表</h2><input id="filter" placeholder="搜尋商品名稱或條碼"><div id="list"></div></section><section id="page-detail" class="hidden"><div id="detail"></div></section></main><div id="modal" class="modal hidden"><div class="modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><nav><button class="active" data-page="page-scan">價格查詢</button><button data-page="page-list">商品列表</button><button data-page="page-detail" class="hidden">商品明細</button></nav><script>const KEY='price-tracker-products',today=new Date().toISOString().slice(0,10);let products=[],idb=null,currentProduct=null;const $=id=>document.getElementById(id),now=()=>new Date().toISOString(),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function validCode(x){return/^\d{8,14}$/.test(String(x||'').trim())}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}function openDB(){if(idb)return Promise.resolve(idb);return new Promise((ok,no)=>{const r=indexedDB.open('price-tracker-images',1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('images'))e.target.result.createObjectStore('images',{keyPath:'id'})};r.onsuccess=()=>{idb=r.result;ok(idb)};r.onerror=()=>no(r.error)})}async function putBlob(key,blob){const d=await openDB();return new Promise((ok,no)=>{const t=d.transaction('images','readwrite');t.objectStore('images').put({id:key,blob});t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function getBlob(key){const d=await openDB();return new Promise((ok,no)=>{const r=d.transaction('images','readonly').objectStore('images').get(key);r.onsuccess=()=>ok(r.result?.blob||null);r.onerror=()=>no(r.error)})}function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return(Array.isArray(x)?x:x.products||[]).map(p=>({...p,brand:p.brand||'',note:p.note||'',aliasBarcodes:p.aliasBarcodes||[],records:p.records||[]}))}catch{return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(products))}function find(code){return products.find(p=>!p.isDeleted&&([p.barcode,...(p.aliasBarcodes||[])].includes(code)))}function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function aliasEditor(vals=[]){return '<label>其他條碼（選填）</label><div id="aliasRows">'+vals.map(v=>'<div class="alias-row"><input class="aliasInput" inputmode="numeric" value="'+esc(v)+'"><button class="danger removeAlias" type="button">x</button></div>').join('')+'</div><button class="secondary" id="addAlias" type="button">＋ 新增其他條碼</button><p class="muted">掃描任何一個條碼都會找到同一件商品。</p>'}function bindAliases(){const add=()=>{const r=document.createElement('div');r.className='alias-row';r.innerHTML='<input class="aliasInput" inputmode="numeric"><button class="danger removeAlias" type="button">x</button>';$('aliasRows').append(r);r.querySelector('button').onclick=()=>r.remove()};$('addAlias').onclick=add;document.querySelectorAll('.removeAlias').forEach(b=>b.onclick=()=>b.parentElement.remove())}function fileInputs(){return '<div class="photo-actions"><button class="secondary" type="button" id="takePhoto">📷 拍照</button><button class="secondary" type="button" id="pickPhoto">🖼 從照片庫選取</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden"><input id="libraryInput" type="file" accept="image/*" class="hidden"><p id="photoStatus" class="muted">尚未選擇照片</p><img id="photoPreview" class="photo-preview hidden">'}function bindPhotos(){const camera=$('cameraInput'),library=$('libraryInput');$('takePhoto').onclick=()=>camera.click();$('pickPhoto').onclick=()=>library.click();camera.onchange=()=>photoChanged(camera.files[0]);library.onchange=()=>photoChanged(library.files[0])}function photoChanged(f){if(!f)return;$('photoStatus').textContent='已選擇：'+f.name;$('photoPreview').src=URL.createObjectURL(f);$('photoPreview').classList.remove('hidden')}async function compress(f){const b=await createImageBitmap(f);let w=b.width,h=b.height;if(Math.max(w,h)>1200){const s=1200/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);b.close();return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82))}async function savePhoto(file,barcode){if(!file)return null;const blob=await compress(file),key='product-photo-'+barcode+'-'+id();await putBlob(key,blob);return{id:key,stored:'indexeddb',mimeType:'image/jpeg',compressedBytes:blob.size,updatedAt:now(),version:Date.now()}}function photoFile(){return $('cameraInput').files[0]||$('libraryInput').files[0]||null}async function displayImage(p){if(p.imageMeta?.id){const b=await getBlob(p.imageMeta.id);if(b)return URL.createObjectURL(b)}return p.imageUrl||''}async function lookup(){const c=$('barcode').value.trim();if(!validCode(c))return alert('請輸入 8–14 位數字條碼');const local=find(c);if(local){$('status').textContent='已找到本機既有商品。';showDetail(local);navigate('page-detail');return}$('status').textContent='正在查詢商品資料…';let data={},found=false;try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(c)+'.json?fields=product_name,product_name_zh,product_name_en,brands,image_front_url,image_front_small_url');if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();found=!!data.product}catch(e){$('status').textContent='網路查詢失敗，仍可手動建立商品。'}const p=data.product||{},name=p.product_name_zh||p.product_name_en||p.product_name||'',brand=p.brands||'',image=p.image_front_url||p.image_front_small_url||'';modal('新增商品｜'+c,'<div class="lookup-result"><strong>'+esc(found&&name?'已找到商品資料':'找不到可用資料，請手動輸入')+'</strong><br><span class="muted">資料來源：Open Food Facts｜條碼：'+esc(c)+'</span></div><label>商品名稱 *</label><input id="name" value="'+esc(name)+'" placeholder="可在名稱中加入容量、型號或數量"><label>品牌</label><input id="brand" value="'+esc(brand)+'" placeholder="選填"><label>備註</label><textarea id="note" rows="3" placeholder="可填寫規格、容量、顏色、型號、包裝數等">'+esc('')+'</textarea><label>圖片網址</label><input id="imageUrl" value="'+esc(image)+'" placeholder="選填"><label>商品照片</label>'+fileInputs()+aliasEditor([])+'<div class="actions"><button class="primary" id="saveProduct">儲存商品</button><button class="secondary" id="cancel">取消</button></div>');bindPhotos();bindAliases();$('saveProduct').onclick=async()=>{try{const n=$('name').value.trim();if(!n)return alert('請輸入商品名稱');const f=photoFile(),meta=await savePhoto(f,c);products.push({barcode:c,name:n,brand:$('brand').value.trim(),note:$('note').value.trim(),aliasBarcodes:readAliases(c),imageUrl:meta?'':$('imageUrl').value.trim(),imageSource:meta?'本機照片':image?'Open Food Facts':'',sourceUrl:'',imageMeta:meta,createdAt:now(),updatedAt:now(),isDeleted:false,deletedAt:'',records:[]});save();closeModal();$('status').textContent='已新增商品「'+n+'」。';renderList();showDetail(find(c));navigate('page-detail')}catch(e){alert(e.message)}};$('cancel').onclick=closeModal}function readAliases(main){const a=[...document.querySelectorAll('.aliasInput')].map(x=>x.value.trim()).filter(Boolean);if(a.some(x=>!validCode(x)))throw Error('其他條碼需為 8–14 位數字');if(a.includes(main))throw Error('其他條碼不能與主要條碼相同');if(new Set(a).size!==a.length)throw Error('其他條碼不可重複');for(const c of a){const owner=products.find(p=>p.barcode!==main&&!p.isDeleted&&[p.barcode,...(p.aliasBarcodes||[])].includes(c));if(owner)throw Error('條碼已屬於商品「'+owner.name+'」')}return a}function editProduct(p){modal('編輯商品｜'+p.barcode,'<label>商品名稱 *</label><input id="name" value="'+esc(p.name)+'"><label>品牌</label><input id="brand" value="'+esc(p.brand)+'"><label>備註</label><textarea id="note" rows="3">'+esc(p.note||'')+'</textarea><label>圖片網址</label><input id="imageUrl" value="'+esc(p.imageUrl||'')+'"><label>商品照片</label>'+fileInputs()+aliasEditor(p.aliasBarcodes||[])+'<div class="actions"><button class="primary" id="saveProduct">儲存</button><button class="secondary" id="cancel">取消</button></div>');bindPhotos();bindAliases();$('saveProduct').onclick=async()=>{try{p.name=$('name').value.trim()||p.name;p.brand=$('brand').value.trim();p.note=$('note').value.trim();p.imageUrl=$('imageUrl').value.trim();p.aliasBarcodes=readAliases(p.barcode);const f=photoFile();if(f){p.imageMeta=await savePhoto(f,p.barcode);p.imageUrl='';p.imageSource='本機照片'}p.updatedAt=now();save();closeModal();renderList();showDetail(p);navigate('page-detail')}catch(e){alert(e.message)}};$('cancel').onclick=closeModal}function showDetail(p){currentProduct=p;const rs=[...(p.records||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date))),lr=rs.filter(r=>!r.isDeleted),recent=lr.length?lr[0].price:'—',lowest=lr.length?Math.min(...lr.map(r=>r.price)):'—';$('detail').innerHTML='<div class="card"><div class="product" style="display:block"><div style="display:flex;gap:12px;align-items:flex-start"><div id="t" class="product-thumb">載入中…</div><div class="product-info"><h3 class="product-name">'+esc(p.name)+'</h3><div class="product-meta">品牌：'+esc(p.brand||'—')+'</div><div class="product-meta">最近價格：'+recent+' 元｜最低：'+lowest+' 元</div><div class="product-meta">最近修改：'+(p.updatedAt?new Date(p.updatedAt).toLocaleString('zh-TW'):'—')+'</div><div class="product-meta">備註：'+esc(p.note||'—')+'</div><div class="product-meta">主要條碼：'+esc(p.barcode)+'</div>'+(p.aliasBarcodes.length?'<div class="product-meta">其他條碼：'+esc(p.aliasBarcodes.join('、'))+'</div>':'')+'</div></div></div><div class="actions"><button class="primary" id="addPrice">新增價格</button><button class="secondary" id="editProduct">編輯商品</button><button class="danger" id="removeProduct">刪除商品</button><button class="secondary" id="backList">返回列表</button></div></div><h3>價格紀錄</h3>'+(rs.map(r=>'<div class="card" style="margin:8px 0"><div style="display:flex;justify-content:space-between;align-items:center"><div>'+esc(r.date)+(r.store?'<div class="muted">'+esc(r.store)+'</div>':'')+'</div><strong>'+esc(r.price)+' 元</strong></div><div class="actions"><button class="secondary" data-e="'+esc(r.id)+'">編輯</button><button class="danger" data-d="'+esc(r.id)+'">刪除</button></div></div>').join('')||'<p class="muted">尚無價格紀錄</p>');displayImage(p).then(src=>{$('t').innerHTML=src?'<img src="'+esc(src)+'">':'無圖片'});$('addPrice').onclick=()=>priceForm(p);$('editProduct').onclick=()=>editProduct(p);$('removeProduct').onclick=()=>delProduct(p.barcode);$('backList').onclick=()=>navigate('page-list');$('detail').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editPrice(p,b.dataset.e));$('detail').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>delPrice(p,b.dataset.d))}function priceForm(p){modal('新增價格','<label>價格</label><input id="pr" type="number" min="0" step="0.01"><label>店家</label><input id="st"><label>日期</label><input id="da" type="date" value="'+today+'"><div class="actions"><button class="primary" id="s">儲存</button><button class="secondary" id="c">取消</button></div>');$('s').onclick=()=>{const v=$('pr').value;if(v===''||Number(v)<0)return alert('請輸入有效價格');p.records.push({id:id(),price:Number(v),store:$('st').value.trim(),date:$('da').value||today,createdAt:now(),updatedAt:now(),isDeleted:false,deletedAt:''});p.updatedAt=now();save();closeModal();showDetail(p)};$('c').onclick=closeModal}function editPrice(p,rid){const r=p.records.find(x=>x.id===rid);if(!r)return;modal('編輯價格','<label>價格</label><input id="pr" type="number" value="'+esc(r.price)+'"><label>店家</label><input id="st" value="'+esc(r.store)+'"><label>日期</label><input id="da" type="date" value="'+esc(r.date)+'"><div class="actions"><button class="primary" id="s">儲存</button><button class="secondary" id="c">取消</button></div>');$('s').onclick=()=>{r.price=Number($('pr').value);r.store=$('st').value.trim();r.date=$('da').value||today;r.updatedAt=now();p.updatedAt=now();save();closeModal();showDetail(p)};$('c').onclick=closeModal}function delPrice(p,rid){const r=p.records.find(x=>x.id===rid);if(!r||!confirm('確定刪除此價格紀錄？'))return;r.isDeleted=true;r.deletedAt=now();r.updatedAt=now();p.updatedAt=now();save();showDetail(p)}function delProduct(c){const p=find(c);if(!p||!confirm('確定刪除「'+p.name+'」及其價格？'))return;p.isDeleted=true;p.deletedAt=now();p.updatedAt=now();p.records.forEach(r=>{r.isDeleted=true;r.deletedAt=now();r.updatedAt=now()});save();navigate('page-list');renderList()}async function renderList(){const q=$('filter').value.trim().toLowerCase(),list=$('list');list.innerHTML='';const a=products.filter(p=>!p.isDeleted&&(p.name.toLowerCase().includes(q)||[p.barcode,...(p.aliasBarcodes||[])].some(x=>x.includes(q))));if(!a.length){list.innerHTML='<p class="muted">尚無商品</p>';return}for(const p of a){const im=await displayImage(p),c=document.createElement('div');c.className='product';const thumb=document.createElement('div');thumb.className='product-thumb';if(im){const img=document.createElement('img');img.src=im;img.alt=p.name;thumb.append(img)}else{thumb.textContent='無圖片'}const info=document.createElement('div');info.className='product-info';const prices=(p.records||[]).filter(r=>!r.isDeleted).map(r=>r.price);const highest=prices.length?Math.max(...prices):'—',lowest=prices.length?Math.min(...prices):'—';info.innerHTML='<h3 class="product-name">'+esc(p.name)+'</h3><div class="product-meta">'+esc(p.brand||'無品牌')+'</div><div class="product-meta">最高：'+(highest==='—'?'—':highest+' 元')+'｜最低：'+(lowest==='—'?'—':lowest+' 元')+'</div><div class="actions"><button class="primary">檢視</button><button class="secondary">編輯</button><button class="danger">刪除</button></div>';const [viewBtn,editBtn,delBtn]=info.querySelectorAll('button');viewBtn.onclick=()=>{showDetail(p);navigate('page-detail')};editBtn.onclick=()=>editProduct(p);delBtn.onclick=()=>delProduct(p.barcode);c.append(thumb,info);list.append(c)}}function navigate(pageId){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));const t=$(pageId);if(t)t.classList.remove('hidden');document.querySelectorAll('nav button[data-page="'+pageId+'"]').forEach(b=>b.classList.add('active'));if(pageId==='page-list')renderList();if(pageId==='page-detail'&&currentProduct)showDetail(currentProduct)}$('searchBtn').onclick=lookup;$('filter').oninput=renderList;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));products=load();renderList();</script></body></html>
