<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的價格紀錄｜Step 13.7</title><style>
:root{--blue:#1976a8;--ink:#243746;--muted:#617789;--line:#d7e0e7;--bg:#f5f7f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:1100px;margin:auto;padding:22px 20px 60px}h1{font-size:34px;margin:0 0 18px}.meta{border:1px solid #cbdce8;background:#f2f7fb;padding:15px;border-radius:12px;color:#506a7b;line-height:1.8}.meta strong{color:#25556f}.card{background:#fff;border-radius:18px;padding:26px;margin:16px 0;box-shadow:0 2px 10px #24374612}.row{display:flex;gap:10px;align-items:end}.field{flex:1}label{display:block;font-weight:700;margin:10px 0 7px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#eef2f5;color:var(--ink);border:1px solid var(--line)}.hint,.empty{color:var(--muted)}.scanner{display:none;margin:16px 0;position:relative;background:#111;border-radius:12px;overflow:hidden}.scanner.show{display:block}.scanner video{width:100%;max-height:320px;object-fit:cover}.line{position:absolute;left:25%;right:25%;top:50%;border-top:3px solid #42bd70}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.product{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}.product img{width:72px;height:72px;object-fit:contain;background:#f4f4f4;border-radius:8px}.info{flex:1}.name{font-size:18px;font-weight:800}.sub,.prices{font-size:14px;color:var(--muted);margin-top:5px}.modal{display:none;position:fixed;inset:0;background:#10202b88;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.dialog{background:#fff;border-radius:16px;padding:24px;max-width:540px;width:100%;max-height:90vh;overflow:auto}.dialog h2{margin:0 0 16px}.preview{display:flex;gap:14px;border:1px solid var(--line);padding:12px;border-radius:12px}.preview img{width:96px;height:96px;object-fit:contain;background:#f4f4f4;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:600px){.row{display:block}.row .btn{width:100%;margin-top:10px}}
</style></head><body><main><h1>我的價格紀錄</h1><div class="meta"><strong>版本：Step 13.7｜商品查詢相容修正版</strong><br>基礎版本：Step 13.6<br>本次修改：使用既有的 price-tracker-products 儲存資料；加入 Open Food Facts 查詢，不更換資料位置。</div><section class="card"><button class="btn" id="start">開啟相機掃描</button> <button class="btn secondary" id="stop" hidden>關閉相機</button><div class="scanner" id="scanner"><video id="video" playsinline></video><div class="line"></div></div><div class="hint">請將條碼放入掃描框</div><div class="row"><div class="field"><label>商品條碼</label><input id="barcode" placeholder="請輸入或掃描條碼" inputmode="numeric"></div><button class="btn" id="lookup">查詢商品</button></div></section><section class="card"><h2>已記錄商品</h2><input id="filter" placeholder="搜尋商品名稱或條碼"><div id="list" class="products"></div></section></main><div class="modal" id="confirm"><div class="dialog"><h2>找到商品資料</h2><div class="preview"><img id="pi"><div><div class="name" id="pn"></div><div class="sub" id="pb"></div><div class="sub" id="pc"></div></div></div><label>商品名稱</label><input id="name"><label>品牌（選填）</label><input id="brand"><label>圖片網址（選填）</label><input id="image"><label>資料來源（選填）</label><input id="source"><div class="actions"><button class="btn" id="saveProduct">確認並新增商品</button><button class="btn secondary" id="manualFromConfirm">資料不正確</button><button class="btn secondary" id="cancelConfirm">取消</button></div></div></div><div class="modal" id="manual"><div class="dialog"><h2>自己輸入商品資料</h2><label>商品條碼</label><input id="mb"><label>商品名稱</label><input id="mn"><label>品牌（選填）</label><input id="mbrand"><label>圖片網址（選填）</label><input id="mimage"><div class="actions"><button class="btn" id="saveManual">新增商品</button><button class="btn secondary" id="cancelManual">取消</button></div></div></div><div class="modal" id="notfound"><div class="dialog"><h2>目前找不到商品資料</h2><p class="hint">目前沒有找到可直接確認的商品資訊。</p><div class="actions"><button class="btn" id="google">到網路上查看商品</button><button class="btn secondary" id="manualNF">自己輸入商品資料</button><button class="btn secondary" id="cancelNF">取消</button></div></div></div><script>
const KEY='price-tracker-products';let products=read(),currentBarcode='';function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}function write(){localStorage.setItem(KEY,JSON.stringify(products))}const $=x=>document.getElementById(x),show=x=>$(x).classList.add('show'),hide=x=>$(x).classList.remove('show');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('filter').value.toLowerCase().trim(),a=products.filter(p=>(p.name||p.barcode||'').toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(p=>{const rs=Array.isArray(p.records)?p.records:[];return `<div class="product"><img src="${esc(p.imageUrl||'')}" onerror="this.style.visibility='hidden'"><div class="info"><div class="name">${esc(p.name||'未命名商品')}</div><div class="sub">${esc(p.brand||'')}　${esc(p.barcode||'')}</div><div class="prices">${rs.length?rs.map(r=>`NT$ ${Number(r.price).toFixed(2)} · ${esc(r.store||'')} · ${esc(r.date||'')}`).join('<br>'):'尚未記錄價格'}</div></div><button class="btn" data-id="${esc(p.id||p.barcode)}">新增價格</button></div>`}).join(''):'<div class="empty">目前尚未有符合的商品。</div>';$('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>addPrice(b.dataset.id))}function addPrice(id){const p=products.find(x=>String(x.id||x.barcode)===String(id));if(!p)return;const v=prompt('請輸入價格');if(v===null)return;const n=Number(v);if(!n||n<0)return alert('請輸入有效價格');p.records=Array.isArray(p.records)?p.records:[];p.records.push({id:Date.now(),productId:p.id||p.barcode,barcode:p.barcode,price:n,store:prompt('購買店家（可留白）')||'',date:new Date().toISOString().slice(0,10)});write();render()}async function off(b){const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(b)}.json`);if(!r.ok)throw 0;const x=await r.json();if(x.status!==1||!x.product)return null;const p=x.product,n=p.product_name_zh||p.product_name||p.product_name_en||'';return n?{barcode:b,name:n,brand:p.brands||'',imageUrl:p.image_front_small_url||p.image_front_url||p.image_url||'',sourceUrl:`https://world.openfoodfacts.org/product/${b}`,imageSource:'Open Food Facts',records:[]} :null}async function lookup(){const b=$('barcode').value.trim();if(!b)return alert('請先輸入或掃描商品條碼');currentBarcode=b;const old=products.find(p=>String(p.barcode)===b);try{const p=old||await off(b);if(p){$('pn').textContent=p.name;$('pb').textContent=p.brand||'';$('pc').textContent=p.barcode;$('pi').src=p.imageUrl||'';$('name').value=p.name||'';$('brand').value=p.brand||'';$('image').value=p.imageUrl||'';$('source').value=p.sourceUrl||'';show('confirm')}else show('notfound')}catch(e){show('notfound')}}function saveProduct(){const n=$('name').value.trim();if(!n)return alert('請輸入商品名稱');let p=products.find(x=>String(x.barcode)===currentBarcode);if(p){p.name=n;p.brand=$('brand').value.trim();p.imageUrl=$('image').value.trim();p.sourceUrl=$('source').value.trim()}else products.push({id:Date.now(),barcode:currentBarcode,name:n,brand:$('brand').value.trim(),imageUrl:$('image').value.trim(),sourceUrl:$('source').value.trim(),imageSource:'Open Food Facts',records:[]});write();hide('confirm');$('barcode').value='';render();alert('商品已儲存')}function manual(){ $('mb').value=currentBarcode||$('barcode').value.trim();show('manual')}function saveManual(){const b=$('mb').value.trim(),n=$('mn').value.trim();if(!b||!n)return alert('請填寫商品條碼與名稱');products.push({id:Date.now(),barcode:b,name:n,brand:$('mbrand').value.trim(),imageUrl:$('mimage').value.trim(),imageSource:'manual',records:[]});write();hide('manual');hide('notfound');$('barcode').value='';render();alert('商品已儲存')}$('lookup').onclick=lookup;$('filter').oninput=render;$('saveProduct').onclick=saveProduct;$('cancelConfirm').onclick=()=>hide('confirm');$('manualFromConfirm').onclick=()=>{hide('confirm');manual()};$('google').onclick=()=>{window.open('https://www.google.com/search?q=%22'+encodeURIComponent(currentBarcode)+'%22','_blank');hide('notfound');manual()};$('manualNF').onclick=()=>{hide('notfound');manual()};$('cancelNF').onclick=()=>hide('notfound');$('saveManual').onclick=saveManual;$('cancelManual').onclick=()=>hide('manual');let stream=null;$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('video').srcObject=stream;$('scanner').classList.add('show');$('start').hidden=true;$('stop').hidden=false;if('BarcodeDetector'in window){const d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});const loop=async()=>{if(!stream)return;try{const a=await d.detect($('video'));if(a[0]){$('barcode').value=a[0].rawValue;stop();lookup()}}catch(e){}requestAnimationFrame(loop)};loop()}}catch(e){alert('無法開啟相機，請確認瀏覽器權限')}};function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('scanner').classList.remove('show');$('start').hidden=false;$('stop').hidden=true}$('stop').onclick=stop;render();</script></body></html>
