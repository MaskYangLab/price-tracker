<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的價格紀錄</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263442;background:#f3f5f7}*{box-sizing:border-box}body{max-width:1000px;margin:auto;padding:12px}section{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #0001}h1{font-size:2rem}h2{margin-top:0}label{display:block;font-weight:700;margin:12px 0 6px}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #c8ced6}input{width:100%}button{cursor:pointer;font-weight:700;border:0}.primary{background:#176da5;color:#fff}.secondary{background:#e7edf2}.danger{background:#c9362b;color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:145px}.muted{color:#68727d}.notice{background:#eaf5ff;border:1px solid #b9ddf5;border-radius:12px;padding:16px}.card{border:1px solid #d8dee6;border-radius:14px;padding:16px;margin:12px 0}.hidden{display:none!important}.price-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;border-top:1px solid #e5e7eb;padding:12px 0}.price-info{min-width:0}.price-value{font-weight:700;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:130px}.small{padding:8px 10px;font-size:.9rem}@media(max-width:560px){.price-row{grid-template-columns:1fr auto}.price-row .record-actions{grid-column:1/-1}.price-value{grid-column:2;grid-row:1}.record-actions{display:flex;gap:6px}.record-actions button{flex:1}}</style></head><body><section><h1>我的價格紀錄</h1><div class="row"><div><label>商品條碼</label><input id="barcode" inputmode="numeric" placeholder="請輸入條碼"></div><div style="align-self:end"><button class="primary" id="searchBtn">查詢商品</button></div></div><p id="status" class="muted"></p></section><section id="detail" class="hidden"></section><section id="listSection"><h2>已記錄商品</h2><input id="filter" placeholder="搜尋商品名稱或條碼"><div id="list"></div></section><section id="productForm" class="hidden"><h2 id="productFormTitle">新增商品</h2><label>商品名稱</label><input id="productName"><label>品牌（選填）</label><input id="brand"><div class="actions"><button class="primary" id="saveProductBtn">儲存商品</button><button class="secondary" id="cancelProductBtn">取消</button></div></section><section id="priceForm" class="hidden"><h2 id="priceFormTitle">輸入本次價格</h2><label>購買價格</label><input id="price" type="number" min="0" step="0.01"><label>購買店家（選填）</label><input id="store"><label>購買日期</label><input id="date" type="date"><div class="actions"><button class="primary" id="savePriceBtn">儲存價格</button><button class="secondary" id="cancelPriceBtn">取消</button></div></section><script>
const KEY='price-tracker-products';let products=[],selected=null,editingProduct=null,editingRecord=null;const $=id=>document.getElementById(id);function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');products=Array.isArray(d)?d.map(p=>({barcode:String(p.barcode),name:p.name||'',brand:p.brand||'',records:Array.isArray(p.records)?p.records:[]})):[]}catch(e){products=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(products))}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function find(c){return products.find(p=>p.barcode===String(c))}function records(p){return p.records||[]}function render(){const q=$('filter').value.trim().toLowerCase(),a=products.filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p class="muted">條碼：${esc(p.barcode)}${p.brand?'｜'+esc(p.brand):''}</p><p>價格紀錄：${records(p).length} 筆</p><button class="primary" data-open="${esc(p.barcode)}">查看商品</button></div>`).join(''):'<p class="muted">目前沒有符合的商品。</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open))}function show(c){const p=find(c);if(!p)return;selected=String(c);$('listSection').classList.add('hidden');$('detail').classList.remove('hidden');const rs=[...records(p)].sort((a,b)=>String(b.date).localeCompare(String(a.date)));const min=rs.length?Math.min(...rs.map(x=>Number(x.price))):null;$('detail').innerHTML=`<div class="notice"><h2>${esc(p.name)}</h2><div>條碼：${esc(p.barcode)}</div>${p.brand?`<div>品牌：${esc(p.brand)}</div>`:''}<p>最近價格：${rs[0]?esc(rs[0].price):'尚無紀錄'}<br>最低價格：${min===null?'尚無紀錄':min.toFixed(2)}</p><div class="actions"><button class="primary" id="add">新增本次價格</button><button class="secondary" id="editProduct">修改商品</button><button class="secondary" id="back">返回商品列表</button></div></div><h3>價格紀錄</h3>${rs.length?rs.map(x=>`<div class="price-row"><div class="price-info"><div>${esc(x.date)}</div>${x.store?`<div class="muted small">店家：${esc(x.store)}</div>`:''}</div><strong class="price-value">${esc(x.price)}</strong><div class="record-actions"><button class="secondary small" data-edit-record="${esc(x.id)}">修改</button><button class="danger small" data-delete-record="${esc(x.id)}">刪除</button></div></div>`).join(''):'<p class="muted">尚無價格紀錄。</p>'}`;$('add').onclick=()=>openPrice(c);$('editProduct').onclick=()=>openProduct(c);$('back').onclick=back;document.querySelectorAll('[data-edit-record]').forEach(b=>b.onclick=()=>openRecord(c,b.dataset.editRecord));document.querySelectorAll('[data-delete-record]').forEach(b=>b.onclick=()=>deleteRecord(c,b.dataset.deleteRecord));window.scrollTo({top:0,behavior:'smooth'})}function back(){selected=null;$('detail').classList.add('hidden');$('listSection').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})}function openProduct(c){editingProduct=find(c);$('productFormTitle').textContent='修改商品';$('productName').value=editingProduct.name;$('brand').value=editingProduct.brand||'';$('productForm').classList.remove('hidden');$('productForm').scrollIntoView({behavior:'smooth'})}function openNew(c){editingProduct={barcode:String(c)};$('productFormTitle').textContent='新增商品';$('productName').value='';$('brand').value='';$('productForm').classList.remove('hidden');$('productForm').scrollIntoView({behavior:'smooth'})}function openPrice(c){editingRecord=null;$('priceFormTitle').textContent='輸入本次價格';$('price').value='';$('store').value='';$('date').value=new Date().toISOString().slice(0,10);$('priceForm').classList.remove('hidden');$('priceForm').scrollIntoView({behavior:'smooth'})}function openRecord(c,id){const p=find(c),r=records(p).find(x=>String(x.id)===String(id));if(!r)return;selected=String(c);editingRecord=r;$('priceFormTitle').textContent='修改價格紀錄';$('price').value=r.price;$('store').value=r.store||'';$('date').value=r.date||'';$('priceForm').classList.remove('hidden');$('priceForm').scrollIntoView({behavior:'smooth'})}function newId(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())}function deleteRecord(c,id){const p=find(c);if(!p)return;if(!confirm('確定要刪除這筆價格紀錄嗎？'))return;p.records=p.records.filter(x=>String(x.id)!==String(id));save();show(c)}$('searchBtn').onclick=()=>{const c=$('barcode').value.trim();if(!c)return $('status').textContent='請輸入條碼。';if(find(c))show(c);else{$('status').textContent='找不到此商品，請先新增商品。';openNew(c)}};$('saveProductBtn').onclick=()=>{const n=$('productName').value.trim();if(!n)return alert('請輸入商品名稱');const p=find(editingProduct.barcode);if(p){p.name=n;p.brand=$('brand').value.trim()}else products.push({barcode:editingProduct.barcode,name:n,brand:$('brand').value.trim(),records:[]});save();$('productForm').classList.add('hidden');load();show(editingProduct.barcode)};$('cancelProductBtn').onclick=()=>$('productForm').classList.add('hidden');$('savePriceBtn').onclick=()=>{const v=$('price').value,p=find(selected);if(v===''||Number(v)<0||!p)return alert('請輸入正確價格');const data={price:Number(v),store:$('store').value.trim(),date:$('date').value};if(editingRecord)Object.assign(editingRecord,data);else{p.records=p.records||[];p.records.push({id:newId(),...data})}save();$('priceForm').classList.add('hidden');show(selected)};$('cancelPriceBtn').onclick=()=>$('priceForm').classList.add('hidden');$('filter').oninput=render;load();render();
</script></body></html>
