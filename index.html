<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的價格紀錄</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1000px;margin:auto;padding:12px;background:#f3f5f7;color:#263442}section{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #0001}h1{font-size:2rem}label{display:block;font-weight:700;margin:12px 0 6px}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #c8ced6}input{width:100%}button{border:0;font-weight:700;cursor:pointer}.primary{background:#176da5;color:#fff}.secondary{background:#e7edf2}.danger{background:#c9362b;color:#fff}.row,.actions{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:145px}.actions button{flex:1;min-width:130px}.muted{color:#68727d}.card{border:1px solid #d8dee6;border-radius:14px;padding:16px;margin:12px 0}.notice{background:#eaf5ff;border:1px solid #b9ddf5;border-radius:12px;padding:16px}.hidden{display:none!important}.price-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;border-top:1px solid #e5e7eb;padding:12px 0;align-items:center}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-box{background:#fff;border-radius:18px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal[hidden]{display:none}.camera{background:#111;border-radius:12px;overflow:hidden;margin-top:12px}.camera video{width:100%;max-height:400px;object-fit:cover}.scan-status{padding:10px;color:#fff;text-align:center}@media(max-width:560px){.price-row{grid-template-columns:1fr auto}.record-actions{grid-column:1/-1}}</style></head><body><section><h1>我的價格紀錄</h1><button class="primary" id="startCamera">開啟相機掃描</button><button class="secondary hidden" id="stopCamera">關閉相機</button><div id="reader" class="camera hidden"><div id="scanStatus" class="scan-status">請將商品條碼放入框內</div></div><div class="row" style="margin-top:16px"><div><label>商品條碼</label><input id="barcode" inputmode="numeric" placeholder="請輸入或掃描條碼"></div><div style="align-self:end"><button class="primary" id="searchBtn">查詢商品</button></div></div><p id="status" class="muted"></p></section><section id="detail" class="hidden"></section><section id="listSection"><h2>已記錄商品</h2><input id="filter" placeholder="搜尋商品名稱或條碼"><div id="list"></div></section><div id="modal" class="modal" hidden><div class="modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><script src="https://unpkg.com/html5-qrcode"></script><script>
const KEY='price-tracker-products';let products=[],selected=null,editingProduct=null,editingRecord=null,scanner=null,scanLocked=false;const $=id=>document.getElementById(id);function load(){try{products=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(products))products=[];products.forEach(p=>{p.barcode=String(p.barcode);p.records=Array.isArray(p.records)?p.records:[]})}catch(e){products=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(products))}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function find(c){return products.find(p=>p.barcode===String(c))}function closeModal(){$('modal').hidden=true}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').hidden=false;const i=$('modalBody').querySelector('input');if(i)i.focus()}function render(){const q=$('filter').value.trim().toLowerCase(),a=products.filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p class="muted">條碼：${esc(p.barcode)}</p><p>價格紀錄：${p.records.length} 筆</p><button class="primary" data-open="${esc(p.barcode)}">查看商品</button></div>`).join(''):'<p class="muted">目前沒有符合的商品。</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open))}function show(c){const p=find(c);if(!p)return;selected=String(c);$('listSection').classList.add('hidden');$('detail').classList.remove('hidden');const rs=[...p.records].sort((a,b)=>String(b.date).localeCompare(String(a.date))),min=rs.length?Math.min(...rs.map(x=>Number(x.price))):null;$('detail').innerHTML=`<div class="notice"><h2>${esc(p.name)}</h2><div>條碼：${esc(p.barcode)}</div>${p.brand?`<div>品牌：${esc(p.brand)}</div>`:''}<p>最近價格：${rs[0]?esc(rs[0].price):'尚無紀錄'}<br>最低價格：${min===null?'尚無紀錄':min.toFixed(2)}</p><div class="actions"><button class="primary" id="add">新增本次價格</button><button class="secondary" id="editProduct">修改商品</button><button class="secondary" id="back">返回商品列表</button></div></div><h3>價格紀錄</h3>${rs.map(x=>`<div class="price-row"><div>${esc(x.date)}${x.store?`<div class="muted">店家：${esc(x.store)}</div>`:''}</div><strong>${esc(x.price)}</strong><div class="record-actions"><button class="secondary" data-edit="${esc(x.id)}">修改</button><button class="danger" data-del="${esc(x.id)}">刪除</button></div></div>`).join('')||'<p class="muted">尚無價格紀錄。</p>'}`;$('add').onclick=()=>openPrice(c);$('editProduct').onclick=()=>openProduct(c);$('back').onclick=()=>{selected=null;$('detail').classList.add('hidden');$('listSection').classList.remove('hidden');render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRecord(c,b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteRecord(c,b.dataset.del))}function openProduct(c){editingProduct=find(c);modal('修改商品',`<label>商品名稱</label><input id="mName" value="${esc(editingProduct.name)}"><label>品牌（選填）</label><input id="mBrand" value="${esc(editingProduct.brand||'')}"><div class="actions"><button class="primary" id="saveM">儲存商品</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=()=>{const n=$('mName').value.trim();if(!n)return alert('請輸入商品名稱');editingProduct.name=n;editingProduct.brand=$('mBrand').value.trim();save();closeModal();show(editingProduct.barcode)};$('cancelM').onclick=closeModal}function openNew(c){modal('查無此商品',`<p>找不到條碼：<strong>${esc(c)}</strong></p><p>是否要建立新商品？</p><div class="actions"><button class="primary" id="createM">建立新商品</button><button class="secondary" id="cancelM">取消</button></div>`);$('createM').onclick=()=>{modal('新增商品',`<label>商品名稱</label><input id="mName"><label>品牌（選填）</label><input id="mBrand"><div class="actions"><button class="primary" id="saveM">儲存商品</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=()=>{const n=$('mName').value.trim();if(!n)return alert('請輸入商品名稱');products.push({barcode:String(c),name:n,brand:$('mBrand').value.trim(),records:[]});save();closeModal();show(c)};$('cancelM').onclick=closeModal};$('cancelM').onclick=closeModal}function openPrice(c){editingRecord=null;selected=String(c);modal('新增本次價格',`<label>購買價格</label><input id="mPrice" type="number" min="0" step="0.01"><label>購買店家（選填）</label><input id="mStore"><label>購買日期</label><input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}"><div class="actions"><button class="primary" id="saveM">儲存價格</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=saveRecord;$('cancelM').onclick=closeModal}function openRecord(c,id){const r=find(c).records.find(x=>String(x.id)===String(id));if(!r)return;selected=String(c);editingRecord=r;modal('修改價格紀錄',`<label>購買價格</label><input id="mPrice" type="number" min="0" value="${esc(r.price)}"><label>購買店家（選填）</label><input id="mStore" value="${esc(r.store||'')}"><label>購買日期</label><input id="mDate" type="date" value="${esc(r.date||'')}"><div class="actions"><button class="primary" id="saveM">更新紀錄</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=saveRecord;$('cancelM').onclick=closeModal}function saveRecord(){const v=$('mPrice').value;if(v===''||Number(v)<0)return alert('請輸入正確價格');const p=find(selected),d={price:Number(v),store:$('mStore').value.trim(),date:$('mDate').value};if(editingRecord)Object.assign(editingRecord,d);else p.records.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...d});save();closeModal();show(selected)}function deleteRecord(c,id){if(!confirm('確定要刪除這筆價格紀錄嗎？'))return;const p=find(c);p.records=p.records.filter(x=>String(x.id)!==String(id));save();show(c)}$('searchBtn').onclick=()=>{const c=$('barcode').value.trim();if(!c)return $('status').textContent='請輸入條碼。';if(find(c))show(c);else{ $('status').textContent='查無此商品。';openNew(c)}};$('filter').oninput=render;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});async function stopCamera(){if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null}scanLocked=false;$('reader').classList.add('hidden');$('startCamera').classList.remove('hidden');$('stopCamera').classList.add('hidden')}$('startCamera').onclick=async()=>{try{scanner=new Html5Qrcode('reader');scanLocked=false;$('reader').classList.remove('hidden');$('startCamera').classList.add('hidden');$('stopCamera').classList.remove('hidden');$('scanStatus').textContent='請將商品條碼放入框內，保持手機穩定';await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:160}},async text=>{if(scanLocked)return;scanLocked=true;const code=String(text).trim();$('barcode').value=code;$('scanStatus').textContent='已偵測：'+code;$('status').textContent='已掃描條碼：'+code;await new Promise(r=>setTimeout(r,300));await stopCamera();if(find(code))show(code);else openNew(code)},()=>{})}catch(e){await stopCamera();$('status').textContent='相機已開啟，但目前未能辨識條碼。請調整距離、光線或條碼位置。';alert('無法啟動條碼掃描，請確認相機權限與條碼清晰度。')}};$('stopCamera').onclick=stopCamera;load();render();</script></body></html>
