<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的價格紀錄</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263442;background:#f3f5f7}*{box-sizing:border-box}body{max-width:1000px;margin:auto;padding:12px}section{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #0001}h1{font-size:2rem}h2{margin-top:0}label{display:block;font-weight:700;margin:12px 0 6px}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #c8ced6}input{width:100%}button{cursor:pointer;font-weight:700;border:0}.primary{background:#176da5;color:#fff}.secondary{background:#e7edf2}.danger{background:#c9362b;color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:145px}.muted{color:#68727d}.notice{background:#eaf5ff;border:1px solid #b9ddf5;border-radius:12px;padding:16px}.card{border:1px solid #d8dee6;border-radius:14px;padding:16px;margin:12px 0}.hidden{display:none!important}.price-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;border-top:1px solid #e5e7eb;padding:12px 0}.price-value{font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:130px}.small{padding:8px 10px;font-size:.9rem}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-box{background:#fff;border-radius:18px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal[hidden]{display:none}@media(max-width:560px){.price-row{grid-template-columns:1fr auto}.record-actions{grid-column:1/-1}}</style></head><body><section><h1>我的價格紀錄</h1><div class="row"><div><label>商品條碼</label><input id="barcode" inputmode="numeric" placeholder="請輸入條碼"></div><div style="align-self:end"><button class="primary" id="searchBtn">查詢商品</button></div></div><p id="status" class="muted"></p></section><section id="detail" class="hidden"></section><section id="listSection"><h2>已記錄商品</h2><input id="filter" placeholder="搜尋商品名稱或條碼"><div id="list"></div></section><div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><script>
const KEY='price-tracker-products';let products=[],selected=null,editingProduct=null,editingRecord=null;const $=id=>document.getElementById(id);function load(){try{products=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(products))products=[];products.forEach(p=>{p.barcode=String(p.barcode);p.records=Array.isArray(p.records)?p.records:[]})}catch(e){products=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(products))}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function find(c){return products.find(p=>p.barcode===String(c))}function show(c){const p=find(c);if(!p)return;selected=String(c);$('listSection').classList.add('hidden');$('detail').classList.remove('hidden');const rs=[...p.records].sort((a,b)=>String(b.date).localeCompare(String(a.date)));const min=rs.length?Math.min(...rs.map(x=>Number(x.price))):null;$('detail').innerHTML=`<div class="notice"><h2>${esc(p.name)}</h2><div>條碼：${esc(p.barcode)}</div>${p.brand?`<div>品牌：${esc(p.brand)}</div>`:''}<p>最近價格：${rs[0]?esc(rs[0].price):'尚無紀錄'}<br>最低價格：${min===null?'尚無紀錄':min.toFixed(2)}</p><div class="actions"><button class="primary" id="add">新增本次價格</button><button class="secondary" id="editProduct">修改商品</button><button class="secondary" id="back">返回商品列表</button></div></div><h3>價格紀錄</h3>${rs.length?rs.map(x=>`<div class="price-row"><div><div>${esc(x.date)}</div>${x.store?`<div class="muted small">店家：${esc(x.store)}</div>`:''}</div><strong class="price-value">${esc(x.price)}</strong><div class="record-actions"><button class="secondary small" data-edit="${esc(x.id)}">修改</button><button class="danger small" data-del="${esc(x.id)}">刪除</button></div></div>`).join(''):'<p class="muted">尚無價格紀錄。</p>'}`;$('add').onclick=()=>openPrice(c);$('editProduct').onclick=()=>openProduct(c);$('back').onclick=back;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRecord(c,b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delRecord(c,b.dataset.del));window.scrollTo({top:0,behavior:'smooth'})}function back(){selected=null;$('detail').classList.add('hidden');$('listSection').classList.remove('hidden');render()}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').hidden=false;const first=$('modalBody').querySelector('input');if(first)first.focus()}function closeModal(){$('modal').hidden=true;$('modalBody').innerHTML=''}function openProduct(c){editingProduct=find(c);modal('修改商品',`<label>商品名稱</label><input id="mName" value="${esc(editingProduct.name)}"><label>品牌（選填）</label><input id="mBrand" value="${esc(editingProduct.brand||'')}"><div class="actions"><button class="primary" id="mSave">儲存商品</button><button class="secondary" id="mCancel">取消</button></div>`);$('mSave').onclick=()=>{const n=$('mName').value.trim();if(!n)return alert('請輸入商品名稱');editingProduct.name=n;editingProduct.brand=$('mBrand').value.trim();save();closeModal();show(editingProduct.barcode)};$('mCancel').onclick=closeModal}function openPrice(c){editingRecord=null;selected=c;modal('新增本次價格',`<label>購買價格</label><input id="mPrice" type="number" min="0" step="0.01"><label>購買店家（選填）</label><input id="mStore"><label>購買日期</label><input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}"><div class="actions"><button class="primary" id="mSave">儲存價格</button><button class="secondary" id="mCancel">取消</button></div>`);$('mSave').onclick=saveRecord;$('mCancel').onclick=closeModal}function openRecord(c,id){const p=find(c),r=p.records.find(x=>String(x.id)===String(id));if(!r)return;selected=c;editingRecord=r;modal('修改價格紀錄',`<label>購買價格</label><input id="mPrice" type="number" min="0" step="0.01" value="${esc(r.price)}"><label>購買店家（選填）</label><input id="mStore" value="${esc(r.store||'')}"><label>購買日期</label><input id="mDate" type="date" value="${esc(r.date||'')}"><div class="actions"><button class="primary" id="mSave">更新紀錄</button><button class="secondary" id="mCancel">取消</button></div>`);$('mSave').onclick=saveRecord;$('mCancel').onclick=closeModal}function saveRecord(){const v=$('mPrice').value;if(v===''||Number(v)<0)return alert('請輸入正確價格');const p=find(selected),data={price:Number(v),store:$('mStore').value.trim(),date:$('mDate').value};if(editingRecord)Object.assign(editingRecord,data);else p.records.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...data});save();closeModal();show(selected)}function delRecord(c,id){if(!confirm('確定要刪除這筆價格紀錄嗎？'))return;const p=find(c);p.records=p.records.filter(x=>String(x.id)!==String(id));save();show(c)}$('searchBtn').onclick=()=>{const c=$('barcode').value.trim();if(!c)return $('status').textContent='請輸入條碼。';if(find(c))show(c);else{$('status').textContent='查無此商品。';editingProduct={barcode:c};modal('查無此商品',`<p>找不到條碼：<strong>${esc(c)}</strong></p><p>是否要建立新商品？</p><div class="actions"><button class="primary" id="create">建立新商品</button><button class="secondary" id="mCancel">取消</button></div>`);$('create').onclick=()=>{modal('新增商品',`<label>商品名稱</label><input id="mName"><label>品牌（選填）</label><input id="mBrand"><div class="actions"><button class="primary" id="mSave">儲存商品</button><button class="secondary" id="mCancel">取消</button></div>`);$('mSave').onclick=()=>{const n=$('mName').value.trim();if(!n)return alert('請輸入商品名稱');products.push({barcode:c,name:n,brand:$('mBrand').value.trim(),records:[]});save();closeModal();show(c)};$('mCancel').onclick=closeModal};$('mCancel').onclick=closeModal}};$('filter').oninput=render;function render(){const q=$('filter').value.trim().toLowerCase();const a=products.filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p class="muted">條碼：${esc(p.barcode)}</p><p>價格紀錄：${p.records.length} 筆</p><button class="primary" data-open="${esc(p.barcode)}">查看商品</button></div>`).join(''):'<p class="muted">目前沒有符合的商品。</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open))}$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});load();render();</script></body></html>
