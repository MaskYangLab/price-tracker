<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的價格紀錄｜Step 13.7.3</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1000px;margin:auto;padding:12px;background:#f3f5f7;color:#263442}section{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #0001}h1{font-size:2rem;margin-bottom:8px}.version{background:#f0f6fb;border:1px solid #c9dfef;border-radius:10px;padding:10px 12px;color:#315a70;font-size:.92rem;line-height:1.6;margin-bottom:18px}.muted{color:#68727d}.hidden{display:none!important}.camera{background:#111;border-radius:12px;overflow:hidden;margin-top:12px}.scan-status{padding:10px;color:#fff;text-align:center}.row{display:flex;gap:8px;align-items:end;margin-top:16px}.row>div{flex:1}label{display:block;font-weight:700;margin:12px 0 6px}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #c8ced6}input{width:100%;box-sizing:border-box}button{border:0;font-weight:700;cursor:pointer}.primary{background:#176da5;color:#fff}.secondary{background:#e7edf2;color:#263442}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}.modal[hidden]{display:none}.box{background:#fff;border-radius:18px;padding:22px;width:min(560px,100%)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}.card{border:1px solid #d8dee6;border-radius:14px;padding:16px;margin:12px 0}@media(max-width:560px){.row{display:block}.row button{width:100%;margin-top:10px}}
</style></head><body><section><h1>我的價格紀錄</h1><div class="version"><strong>版本：Step 13.7.3｜相機重新啟動修正版</strong><br>基礎版本：Step 13.7.2<br>本次修改：避免重複使用同一個掃描容器，關閉後重新建立掃描容器，允許再次開啟。<br>資料位置：price-tracker-products（未變更）<br>掃描框：維持 280 × 120。</div><button class="primary" id="start">開啟相機掃描</button> <button class="secondary hidden" id="stop">關閉相機</button><div id="holder"></div><p class="muted" id="status">請將條碼放入掃描框</p><div class="row"><div><label>商品條碼</label><input id="barcode" inputmode="numeric" placeholder="請輸入或掃描條碼"></div><button class="primary" id="search">查詢商品</button></div></section><section><h2>已記錄商品</h2><input id="filter" placeholder="搜尋商品名稱或條碼"><div id="list"></div></section><div class="modal" id="modal" hidden><div class="box"><h2 id="title"></h2><div id="body"></div></div></div><script src="https://unpkg.com/html5-qrcode"></script><script>
const KEY='price-tracker-products';let products=load(),scanner=null,running=false,starting=false,handled=false;const $=id=>document.getElementById(id);function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x.map(p=>({...p,barcode:String(p.barcode),records:Array.isArray(p.records)?p.records:[]})):[]}catch{return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(products))}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){const q=$('filter').value.trim().toLowerCase(),a=products.filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="muted">條碼：${esc(p.barcode)}　價格紀錄：${p.records.length} 筆</div></div>`).join(''):'<p class="muted">目前沒有符合的商品。</p>'}function showNotFound(c){$('title').textContent='找不到自動商品資料';$('body').innerHTML=`<p class="muted">目前沒有找到此條碼的商品資料。</p><label>商品名稱</label><input id="n"><label>品牌（選填）</label><input id="b"><div class="actions"><button class="primary" id="saveP">確認並儲存</button><button class="secondary" id="cancelP">取消</button></div>`;$('modal').hidden=false;$('saveP').onclick=()=>{const n=$('n').value.trim();if(!n)return alert('請輸入商品名稱');products.push({id:Date.now(),barcode:c,name:n,brand:$('b').value.trim(),imageUrl:'',imageSource:'',sourceUrl:'',records:[]});save();$('modal').hidden=true;render()};$('cancelP').onclick=()=>{$('modal').hidden=true}}async function query(c){const code=String(c||'').trim();if(!/^\d{8,14}$/.test(code))return alert('請輸入 8 到 14 位數字的條碼。');$('barcode').value=code;const p=products.find(x=>x.barcode===code);if(p){$('status').textContent='已找到商品：'+p.name;return}try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`),d=await r.json(),x=d.product||{};if(d.status===1&&(x.product_name_zh||x.product_name||x.product_name_en||x.image_url)){showNotFound(code);$('n').value=x.product_name_zh||x.product_name||x.product_name_en||'';$('b').value=x.brands||''}else showNotFound(code)}catch{showNotFound(code)}}$('search').onclick=()=>query($('barcode').value);$('filter').oninput=render;
function makeReader(){const el=document.createElement('div');el.className='camera';el.id='reader-'+Date.now();el.innerHTML='<div class="scan-status">請將條碼放入掃描框</div>';$("holder").replaceChildren(el);return el}
async function closeScanner(){const s=scanner;scanner=null;running=false;starting=false;handled=false;$('start').disabled=false;$('start').classList.remove('hidden');$('stop').classList.add('hidden');if(s){try{await s.stop()}catch{}try{await s.clear()}catch{}}$('holder').replaceChildren()}
async function startScanner(){if(running||starting)return;starting=true;handled=false;$('start').disabled=true;try{const el=makeReader();const s=new Html5Qrcode(el.id);scanner=s;$('start').classList.add('hidden');$('stop').classList.remove('hidden');await s.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120},aspectRatio:1.777},async text=>{if(handled)return;const code=String(text||'').trim();if(!code)return;handled=true;await closeScanner();$('barcode').value=code;$('status').textContent='已讀取條碼：'+code;await query(code)},()=>{});running=true;starting=false}catch(e){await closeScanner();$('status').textContent='相機啟動失敗：'+(e.message||'請確認相機權限。');alert('相機啟動失敗，請確認相機權限。')}}$('start').onclick=startScanner;$('stop').onclick=closeScanner;render();</script></body></html>
