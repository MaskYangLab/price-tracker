<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的價格紀錄</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263442;background:#f3f5f7}*{box-sizing:border-box}body{max-width:1000px;margin:auto;padding:12px}section{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #0001}h1{font-size:2rem}h2{margin-top:0}label{display:block;font-weight:700;margin:12px 0 6px}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #c8ced6}input{width:100%}button{cursor:pointer;font-weight:700;border:0}.primary{background:#176da5;color:#fff}.secondary{background:#e7edf2}.danger{background:#c9362b;color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:145px}.muted{color:#68727d}.notice{background:#eaf5ff;border:1px solid #b9ddf5;border-radius:12px;padding:16px}.card{border:1px solid #d8dee6;border-radius:14px;padding:16px;margin:12px 0}.selected{border:2px solid #176da5;background:#f1f8ff}.hidden{display:none!important}.price-row{display:flex;justify-content:space-between;border-top:1px solid #e5e7eb;padding:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:130px}.camera{background:#111;color:#fff;border-radius:12px;overflow:hidden;margin-top:12px}.camera video{width:100%;max-height:360px;object-fit:cover}</style></head><body><section><h1>我的價格紀錄</h1><button class="primary" id="startCamera">開啟相機掃描</button><button class="secondary hidden" id="stopCamera">關閉相機</button><div id="reader" class="camera hidden"></div><div class="row" style="margin-top:16px"><div><label>商品條碼</label><input id="barcode" inputmode="numeric" placeholder="請輸入或掃描條碼"></div><div style="align-self:end"><button class="primary" id="searchBtn">查詢商品</button></div></div><p id="status" class="muted"></p></section><section id="detail" class="hidden"></section><section id="listSection"><h2>已記錄商品</h2><input id="filter" placeholder="搜尋商品名稱或條碼"><div id="list"></div></section><section id="productForm" class="hidden"><h2 id="productFormTitle">新增商品</h2><label>商品名稱</label><input id="productName"><label>品牌（選填）</label><input id="brand"><div class="actions"><button class="primary" id="saveProductBtn">儲存商品</button><button class="secondary" id="cancelProductBtn">取消</button></div></section><section id="priceForm" class="hidden"><h2>輸入本次價格</h2><label>購買價格</label><input id="price" type="number" min="0" step="0.01"><label>購買店家（選填）</label><input id="store"><label>購買日期</label><input id="date" type="date"><div class="actions"><button class="primary" id="savePriceBtn">儲存價格</button><button class="secondary" id="cancelPriceBtn">取消</button></div></section><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script>
const KEY="priceTrackerProducts";let products=[],selectedBarcode=null,editingProduct=null,scanner=null;const $=id=>document.getElementById(id);function normalize(p){return{barcode:String(p.barcode??p.code??""),name:p.name||p.productName||"未命名商品",brand:p.brand||"",prices:(p.prices||p.records||p.history||[]).map(x=>({price:x.price??x.amount??0,store:x.store??x.shop??"",date:x.date??x.purchaseDate??""}))}}function load(){try{const raw=localStorage.getItem(KEY);const data=raw?JSON.parse(raw):[];products=(Array.isArray(data)?data:[]).map(normalize)}catch(e){products=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(products))}function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function find(c){return products.find(p=>p.barcode===c)}function render(){const q=$("filter").value.trim().toLowerCase();const a=products.filter(p=>(p.name+" "+p.barcode).toLowerCase().includes(q));$("list").innerHTML=a.length?a.map(p=>`<div class="card ${p.barcode===selectedBarcode?'selected':''}"><h3>${esc(p.name)}</h3><p class="muted">條碼：${esc(p.barcode)}</p><p>價格紀錄：${p.prices.length} 筆</p><button class="primary" data-open="${esc(p.barcode)}">查看商品</button></div>`).join(""):"<p class='muted'>目前沒有符合的商品。</p>";document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>detail(b.dataset.open))}function detail(c){const p=find(c);if(!p)return;selectedBarcode=c;$("barcode").value=c;$("listSection").classList.add("hidden");$("detail").classList.remove("hidden");const ps=[...p.prices].sort((a,b)=>String(b.date).localeCompare(String(a.date))),min=ps.length?Math.min(...ps.map(x=>Number(x.price))):null;$("detail").innerHTML=`<div class="notice"><h2>${esc(p.name)}</h2><div>條碼：${esc(p.barcode)}</div>${p.brand?`<div>品牌：${esc(p.brand)}</div>`:""}<p>最近價格：${ps[0]?esc(ps[0].price):"尚無紀錄"}<br>最低價格：${min===null?"尚無紀錄":min.toFixed(2)}</p><div class="actions"><button class="primary" id="add">新增本次價格</button><button class="secondary" id="edit">修改商品</button><button class="secondary" id="back">返回商品列表</button></div></div><h3>價格紀錄</h3>${ps.length?ps.map(x=>`<div class="price-row"><span>${esc(x.date)}${x.store?"｜"+esc(x.store):""}</span><strong>${esc(x.price)}</strong></div>`).join(""):"<p class='muted'>尚無價格紀錄。</p>"}`;$("add").onclick=()=>openPrice(c);$("edit").onclick=()=>openProduct(c);$("back").onclick=back;render();window.scrollTo({top:0,behavior:"smooth"})}function back(){selectedBarcode=null;$("detail").classList.add("hidden");$("listSection").classList.remove("hidden");render();window.scrollTo({top:0,behavior:"smooth"})}function openProduct(c){editingProduct=find(c);$("productFormTitle").textContent="修改商品";$("productName").value=editingProduct.name;$("brand").value=editingProduct.brand;$("productForm").classList.remove("hidden");$("productForm").scrollIntoView({behavior:"smooth"})}function openNew(c){editingProduct={barcode:c};$("productFormTitle").textContent="新增商品";$("productName").value="";$("brand").value="";$("productForm").classList.remove("hidden");$("productForm").scrollIntoView({behavior:"smooth"})}function openPrice(c){selectedBarcode=c;$("price").value="";$("store").value="";$("date").value=new Date().toISOString().slice(0,10);$("priceForm").classList.remove("hidden");$("priceForm").scrollIntoView({behavior:"smooth"})}$("searchBtn").onclick=()=>{const c=$("barcode").value.trim();if(!c){$("status").textContent="請輸入或掃描條碼。";return}const p=find(c);if(p){$("status").textContent="已找到商品。";detail(c)}else{$("status").textContent="找不到此商品，請先新增商品。";openNew(c)}};$("saveProductBtn").onclick=()=>{const n=$("productName").value.trim();if(!n)return alert("請輸入商品名稱");const p=find(editingProduct.barcode);if(p){p.name=n;p.brand=$("brand").value.trim()}else products.push({barcode:editingProduct.barcode,name:n,brand:$("brand").value.trim(),prices:[]});save();$("productForm").classList.add("hidden");render();detail(editingProduct.barcode)};$("cancelProductBtn").onclick=()=>$("productForm").classList.add("hidden");$("savePriceBtn").onclick=()=>{const v=$("price").value;if(v===""||Number(v)<0)return alert("請輸入正確價格");find(selectedBarcode).prices.push({price:Number(v),store:$("store").value.trim(),date:$("date").value});save();$("priceForm").classList.add("hidden");detail(selectedBarcode)};$("cancelPriceBtn").onclick=()=>$("priceForm").classList.add("hidden");$("filter").oninput=render;
async function stop(){if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null}$("reader").classList.add("hidden");$("startCamera").classList.remove("hidden");$("stopCamera").classList.add("hidden")}$("startCamera").onclick=async()=>{try{scanner=new Html5Qrcode("reader");$("reader").classList.remove("hidden");$("startCamera").classList.add("hidden");$("stopCamera").classList.remove("hidden");await scanner.start({facingMode:{exact:"environment"}},{fps:10,qrbox:{width:250,height:150},videoConstraints:{facingMode:{ideal:"environment"},focusMode:"continuous",width:{ideal:1920},height:{ideal:1080}}},async t=>{$("barcode").value=t;await stop();$("searchBtn").click()},()=>{})}catch(e){await stop();alert("無法開啟相機，請確認已允許相機權限。")}};load();render();
</script></body></html>
