<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的價格紀錄｜Step 13.8</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>body{margin:0;background:#f8fafd;color:#202124;font-family:system-ui,-apple-system,"Noto Sans TC",Arial,sans-serif}main{max-width:900px;margin:28px auto;padding:0 16px 50px}.card{background:#fff;border:1px solid #dadce0;border-radius:16px;padding:22px;margin:16px 0}h1{margin:0;font-size:28px}h2{margin:0 0 12px;font-size:20px}.muted{color:#5f6368;line-height:1.6}.small{font-size:13px}.status{padding:12px;border-radius:10px;background:#eef3fd;color:#174ea6;white-space:pre-wrap;line-height:1.55}.status.ok{background:#e6f4ea;color:#137333}.status.error{background:#fce8e6;color:#b3261e}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}button{border:1px solid #1967d2;border-radius:8px;padding:11px 15px;background:#1967d2;color:#fff;font:inherit;font-weight:650;cursor:pointer}button.secondary{background:#fff;color:#1967d2}button:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:grid;gap:6px;font-size:14px;font-weight:600}input,select{width:100%;padding:11px;border:1px solid #dadce0;border-radius:8px;font:inherit}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #dadce0}.empty{color:#5f6368;padding:12px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9aa0a6;margin-right:6px}.dot.pending{background:#f9ab00}.dot.synced{background:#34a853}</style>
</head><body><main>
<h1>我的價格紀錄</h1><p class="muted">Step 13.8｜商品、價格紀錄與 Google Drive 個人同步測試版</p>
<section class="card"><h2>Google Drive 同步</h2><p class="muted small">每個 Google 帳號使用自己的 appDataFolder；資料不與其他帳號共用。</p><div id="status" class="status">正在載入 Google 授權元件…</div><div class="row"><button id="auth" disabled>連線並授權 Google Drive</button><button id="upload" disabled>同步到雲端</button><button id="download" class="secondary" disabled>從雲端下載</button></div><p class="small muted"><span id="dot" class="dot"></span><span id="syncText">尚未同步</span></p></section>
<section class="card"><h2>新增商品</h2><p class="muted">此頁是同步流程測試版，不包含照片壓縮功能。</p><div class="grid"><label>商品條碼<input id="barcode" placeholder="例如 TEST-001"></label><label>商品名稱<input id="name" placeholder="例如 測試商品"></label><label>品牌（選填）<input id="brand" placeholder="品牌"></label></div><div class="row"><button id="addProduct">新增／更新商品</button></div></section>
<section class="card"><h2>新增價格紀錄</h2><div class="grid"><label>商品<select id="product"><option value="">請先新增商品</option></select></label><label>價格<input id="price" type="number" min="0" step="0.01" placeholder="例如 99"></label><label>店家（選填）<input id="store" placeholder="例如 全聯"></label><label>日期<input id="date" type="date"></label></div><div class="row"><button id="addPrice" disabled>新增價格紀錄</button></div></section>
<section class="card"><h2>已記錄商品</h2><div id="productList"></div></section><section class="card"><h2>價格紀錄</h2><div id="recordList"></div></section>
</main><script>
const CLIENT_ID='228612325011-u1uoard7b2its8h6o1sd9c7bb1jb7lac.apps.googleusercontent.com';const SCOPE='https://www.googleapis.com/auth/drive.appdata';const FILE='price-tracker-database.json';const KEY='priceTrackerDatabase';let db,oauth,accessToken='',expiresAt=0,pending=null;const $=id=>document.getElementById(id);
function empty(){return{schemaVersion:1,updatedAt:new Date().toISOString(),products:[],priceRecords:[]}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.products)&&Array.isArray(x.priceRecords)?x:empty()}catch{return empty()}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(t,c=''){$('status').textContent=t;$('status').className='status '+c}function changed(){ $('dot').className='dot pending';$('syncText').textContent='本機有尚未同步的變更'}function saved(t){$('dot').className='dot synced';$('syncText').textContent=t}function save(){db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db));changed();render()}
function render(){const old=$('product').value;$('product').innerHTML='<option value="">請選擇商品</option>'+db.products.map(p=>`<option value="${esc(p.barcode)}">${esc(p.name)}（${esc(p.barcode)}）</option>`).join('');if(db.products.some(p=>p.barcode===old))$('product').value=old;$('addPrice').disabled=!$('product').value;$('productList').innerHTML=db.products.length?'<table><tr><th>商品名稱</th><th>條碼</th><th>品牌</th></tr>'+db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.barcode)}</td><td>${esc(p.brand||'—')}</td></tr>`).join('')+'</table>':'<p class="empty">尚未新增商品。</p>';$('recordList').innerHTML=db.priceRecords.length?'<table><tr><th>商品</th><th>價格</th><th>店家</th><th>日期</th></tr>'+db.priceRecords.slice().reverse().map(r=>{const p=db.products.find(x=>x.barcode===r.barcode);return`<tr><td>${esc(p?.name||r.barcode)}</td><td>${Number(r.price).toLocaleString('zh-TW')}</td><td>${esc(r.store||'—')}</td><td>${esc(r.date)}</td></tr>`}).join('')+'</table>':'<p class="empty">尚未新增價格紀錄。</p>'}
$('addProduct').onclick=()=>{const barcode=$('barcode').value.trim(),name=$('name').value.trim();if(!barcode||!name){alert('請填寫商品條碼與名稱。');return}const p={barcode,name,brand:$('brand').value.trim(),updatedAt:new Date().toISOString()};const i=db.products.findIndex(x=>x.barcode===barcode);if(i<0)db.products.push(p);else db.products[i]={...db.products[i],...p};save();$('product').value=barcode;$('addPrice').disabled=false};$('product').onchange=()=>{$('addPrice').disabled=!$('product').value};$('addPrice').onclick=()=>{const barcode=$('product').value,price=Number($('price').value);if(!barcode||!Number.isFinite(price)||price<0){alert('請選商品並輸入有效價格。');return}db.priceRecords.push({id:crypto.randomUUID(),barcode,price,store:$('store').value.trim(),date:$('date').value||new Date().toISOString().slice(0,10),createdAt:new Date().toISOString()});$('price').value='';$('store').value='';save()};
function headers(x={}){return{Authorization:'Bearer '+accessToken,...x}}async function find(){const q=encodeURIComponent(`name='${FILE}' and 'appDataFolder' in parents and trashed=false`);const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=appDataFolder&fields=files(id,modifiedTime)`,{headers:headers()});if(!r.ok)throw Error(await r.text());return(await r.json()).files?.[0]||null}async function uploadBody(url,method,meta,data){const b='pt_'+crypto.randomUUID();const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${data}\r\n--${b}--`;const r=await fetch(url,{method,headers:headers({'Content-Type':`multipart/related; boundary=${b}`}),body});if(!r.ok)throw Error(await r.text());return r.json()}function friendly(e){const s=String(e.message||e);if(s.includes('origin_mismatch'))return'目前網站來源未加入 OAuth 已授權的 JavaScript 來源。';if(s.includes('accessNotConfigured'))return'Google Drive API 尚未啟用。';if(s.includes('403'))return'Google 拒絕存取，請確認登入帳號已列為測試使用者。';return s}
async function upload(){try{status('正在同步到 Google Drive…');const f=await find(),data=JSON.stringify(db,null,2);const r=f?await uploadBody(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=multipart&fields=id`,'PATCH',{name:FILE,mimeType:'application/json'},data):await uploadBody('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id','POST',{name:FILE,mimeType:'application/json',parents:['appDataFolder']},data);localStorage.setItem(KEY,JSON.stringify(db));status('Google Drive 同步成功。','ok');saved('已同步到雲端：'+new Date().toLocaleString('zh-TW'))}catch(e){status('同步失敗：'+friendly(e),'error')}}async function download(){try{status('正在從 Google Drive 下載…');const f=await find();if(!f)throw Error('雲端尚未有同步檔，請先在另一台裝置同步一次。');const r=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:headers()});if(!r.ok)throw Error(await r.text());const x=await r.json();if(!Array.isArray(x.products)||!Array.isArray(x.priceRecords))throw Error('雲端資料格式不正確。');db=x;localStorage.setItem(KEY,JSON.stringify(db));render();status('已從 Google Drive 下載資料。','ok');saved('已從雲端下載：'+new Date(f.modifiedTime).toLocaleString('zh-TW'))}catch(e){status('下載失敗：'+friendly(e),'error')}}function authorize(action=null){pending=action;if(!oauth){status('Google 授權元件尚未就緒。','error');return}if(accessToken&&Date.now()<expiresAt){run();return}status('請在 Google 視窗選擇帳號並同意 Drive App Data 權限。');oauth.requestAccessToken({prompt:accessToken?'':'consent'})}function run(){const x=pending;pending=null;if(x==='upload')upload();if(x==='download')download()}function init(){if(!window.google?.accounts?.oauth2){setTimeout(init,100);return}oauth=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>{if(r.error){status('Google 授權失敗：'+(r.error_description||r.error),'error');return}accessToken=r.access_token;expiresAt=Date.now()+((r.expires_in||3600)*1000)-30000;$('upload').disabled=false;$('download').disabled=false;status('Google Drive 已授權。','ok');run()}});$('auth').disabled=false;status('Google 授權元件已就緒。請按「連線並授權 Google Drive」。')}db=load();$('date').value=new Date().toISOString().slice(0,10);render();$('auth').onclick=()=>authorize();$('upload').onclick=()=>authorize('upload');$('download').onclick=()=>authorize('download');init();
</script></body></html>
