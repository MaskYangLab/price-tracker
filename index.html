<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的價格紀錄</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1000px;margin:auto;padding:12px;background:#f3f5f7;color:#263442}section{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #0001}h1{font-size:2rem}label{display:block;font-weight:700;margin:12px 0 6px}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #c8ced6}input{width:100%}button{border:0;font-weight:700;cursor:pointer}.primary{background:#176da5;color:#fff}.secondary{background:#e7edf2}.danger{background:#c9362b;color:#fff}.row,.actions{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:145px}.actions button{flex:1;min-width:130px}.muted{color:#68727d}.card{border:1px solid #d8dee6;border-radius:14px;padding:16px;margin:12px 0}.notice{background:#eaf5ff;border:1px solid #b9ddf5;border-radius:12px;padding:16px}.hidden{display:none!important}.price-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;border-top:1px solid #e5e7eb;padding:12px 0;align-items:center}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-box{background:#fff;border-radius:18px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal[hidden]{display:none}.camera{background:#111;border-radius:12px;overflow:hidden;margin-top:12px}.camera video{width:100%;max-height:400px;object-fit:cover}.scan-status{padding:10px;color:#fff;text-align:center}</style></head><body><section><h1>我的價格紀錄</h1><button class="primary" id="startCamera">開啟相機掃描</button><button class="secondary hidden" id="stopCamera">關閉相機</button><div id="reader" class="camera hidden"><div id="scanStatus" class="scan-status">請允許相機權限，並將條碼放入掃描框</div></div><div class="row" style="margin-top:16px"><div><label>商品條碼</label><input id="barcode" inputmode="numeric" placeholder="請輸入或掃描條碼"></div><div style="align-self:end"><button class="primary" id="searchBtn">查詢商品</button></div></div><p id="status" class="muted"></p></section><section id="detail" class="hidden"></section><section id="listSection"><h2>已記錄商品</h2><input id="filter" placeholder="搜尋商品名稱或條碼"><div id="list"></div></section><div id="modal" class="modal" hidden><div class="modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><script src="https://unpkg.com/html5-qrcode"></script><script>
const STORAGE_KEY='price-tracker-products';const today=new Date().toISOString().slice(0,10);let products=loadProducts(),pendingProduct=null,activeProduct=null,editingProduct=null,editingPrice=null,scanner=null,scannerRunning=false;const $=id=>document.getElementById(id);function makeId(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`}function loadProducts(){const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return[];try{const data=JSON.parse(raw);return Array.isArray(data)?data.map(p=>({...p,barcode:String(p.barcode),records:(p.records||[]).map(r=>({...r,id:r.id||makeId(),price:Number(r.price)||0,store:r.store||'',date:r.date||today}))})):[]}catch{return[]}}function saveProducts(){localStorage.setItem(STORAGE_KEY,JSON.stringify(products))}function findProduct(c){return products.find(p=>String(p.barcode)===String(c))}function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function renderProducts(){const q=$('filter').value.trim().toLowerCase(),a=products.filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(p=>`<div class="card"><h3>${escapeHtml(p.name)}</h3><p class="muted">條碼：${escapeHtml(p.barcode)}${p.brand?' ・ '+escapeHtml(p.brand):''}</p><p>價格紀錄：${p.records.length} 筆</p><button class="primary" data-open="${escapeHtml(p.barcode)}">查看商品</button></div>`).join(''):'<p class="muted">目前沒有符合的商品。</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>showDetail(b.dataset.open))}function showDetail(c){const p=findProduct(c);if(!p)return;activeProduct=p;$('listSection').classList.add('hidden');$('detail').classList.remove('hidden');const rs=[...p.records].sort((a,b)=>b.date.localeCompare(a.date));const min=rs.length?Math.min(...rs.map(r=>Number(r.price))):null;$('detail').innerHTML=`<div class="notice"><h2>${escapeHtml(p.name)}</h2><div>條碼：${escapeHtml(p.barcode)}</div>${p.brand?`<div>品牌：${escapeHtml(p.brand)}</div>`:''}<p>最近價格：${rs[0]?escapeHtml(rs[0].price):'尚無紀錄'}<br>最低價格：${min===null?'尚無紀錄':min.toFixed(2)}</p><div class="actions"><button class="primary" id="addPrice">新增本次價格</button><button class="secondary" id="editProduct">修改商品</button><button class="secondary" id="back">返回商品列表</button></div></div><h3>價格紀錄</h3>${rs.map(r=>`<div class="price-row"><span>${escapeHtml(r.date)}${r.store?'｜'+escapeHtml(r.store):''}</span><strong>${escapeHtml(r.price)}</strong><span></span></div>`).join('')||'<p class="muted">尚無價格紀錄。</p>'}`;$('addPrice').onclick=()=>openPrice(p);$('editProduct').onclick=()=>openProduct(p);$('back').onclick=()=>{activeProduct=null;$('detail').classList.add('hidden');$('listSection').classList.remove('hidden');renderProducts()}}function modal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').hidden=false;const i=$('modalBody').querySelector('input');if(i)i.focus()}function closeModal(){$('modal').hidden=true}$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};function openProduct(p){editingProduct=p;modal('修改商品',`<label>商品名稱</label><input id="mName" value="${escapeHtml(p.name)}"><label>品牌（選填）</label><input id="mBrand" value="${escapeHtml(p.brand||'')}"><div class="actions"><button class="primary" id="saveM">儲存商品</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=()=>{const n=$('mName').value.trim();if(!n)return alert('請輸入商品名稱');p.name=n;p.brand=$('mBrand').value.trim();saveProducts();closeModal();showDetail(p.barcode)};$('cancelM').onclick=closeModal}function openPrice(p){activeProduct=p;modal('新增本次價格',`<label>購買價格</label><input id="mPrice" type="number" min="0" step="0.01"><label>購買店家（選填）</label><input id="mStore"><label>購買日期</label><input id="mDate" type="date" value="${today}"><div class="actions"><button class="primary" id="saveM">儲存價格</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=()=>savePrice();$('cancelM').onclick=closeModal}function savePrice(){const v=$('mPrice').value;if(v===''||Number(v)<0)return alert('請輸入有效價格');activeProduct.records.push({id:makeId(),price:Number(v),store:$('mStore').value.trim(),date:$('mDate').value||today});saveProducts();closeModal();showDetail(activeProduct.barcode)}$('searchBtn').onclick=()=>{const c=$('barcode').value.trim();if(!/^\d{8,14}$/.test(c))return alert('請輸入 8 到 14 位數字的條碼。');const p=findProduct(c);if(p)showDetail(c);else{pendingProduct={barcode:c};$('status').textContent='查無此商品。';modal('查無此商品',`<p>找不到條碼：<strong>${escapeHtml(c)}</strong></p><p>是否要建立新商品？</p><div class="actions"><button class="primary" id="createM">建立新商品</button><button class="secondary" id="cancelM">取消</button></div>`);$('createM').onclick=()=>{modal('新增商品',`<label>商品名稱</label><input id="mName"><label>品牌（選填）</label><input id="mBrand"><div class="actions"><button class="primary" id="saveM">新增商品</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=()=>{const n=$('mName').value.trim();if(!n)return alert('請輸入商品名稱');products.push({barcode:c,name:n,brand:$('mBrand').value.trim(),records:[]});saveProducts();closeModal();showDetail(c)};$('cancelM').onclick=closeModal};$('cancelM').onclick=closeModal}};$('filter').oninput=renderProducts;async function stopScanner(){if(scanner){try{await scanner.stop();await scanner.clear()}catch{}scanner=null}scannerRunning=false;$('reader').classList.add('hidden');$('startCamera').classList.remove('hidden');$('stopCamera').classList.add('hidden')}$('startCamera').onclick=async()=>{if(scannerRunning)return;try{scanner=new Html5Qrcode('reader');$('reader').classList.remove('hidden');$('startCamera').classList.add('hidden');$('stopCamera').classList.remove('hidden');$('scanStatus').textContent='請允許相機權限，並將條碼放入掃描框。';await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120},aspectRatio:1.777},async decodedText=>{$('barcode').value=decodedText;$('status').textContent='已讀取條碼：'+decodedText;await stopScanner();$('searchBtn').click() },()=>{});scannerRunning=true}catch(e){await stopScanner();$('status').textContent='相機啟動失敗：'+(e.message||'請確認相機權限。');alert('相機啟動失敗，請確認相機權限。')}};$('stopCamera').onclick=stopScanner;renderProducts();</script></body></html>
