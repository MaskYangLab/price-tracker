<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的價格紀錄｜Step 13.4</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1000px;margin:auto;padding:12px;background:#f3f5f7;color:#263442}
section{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
h1{font-size:2rem;margin-bottom:8px}.version{background:#f0f6fb;border:1px solid #c9dfef;border-radius:10px;padding:10px 12px;color:#315a70;font-size:.92rem;line-height:1.6;margin-bottom:18px}
label{display:block;font-weight:700;margin:12px 0 6px}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #c8ced6}input{width:100%}button{border:0;font-weight:700;cursor:pointer}.primary{background:#176da5;color:#fff}.secondary{background:#e7edf2}.danger{background:#c9362b;color:#fff}.row,.actions{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:145px}.actions button{flex:1;min-width:130px}.muted{color:#68727d}.card{border:1px solid #d8dee6;border-radius:14px;padding:16px;margin:12px 0}.notice{background:#eaf5ff;border:1px solid #b9ddf5;border-radius:12px;padding:16px}.hidden{display:none!important}.price-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;border-top:1px solid #e5e7eb;padding:12px 0;align-items:center}.product-head{display:flex;gap:18px;align-items:flex-start;justify-content:space-between}.product-info{min-width:0;flex:1}.thumb{width:150px;height:190px;border:3px solid #263442;background:#fff;border-radius:4px;object-fit:contain;display:block}.thumb-empty{width:150px;height:190px;border:2px dashed #9eb2c0;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:#68727d;background:#f8fbfd;padding:8px;box-sizing:border-box}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-box{background:#fff;border-radius:18px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal[hidden]{display:none}.camera{background:#111;border-radius:12px;overflow:hidden;margin-top:12px}.scan-status{padding:10px;color:#fff;text-align:center}@media(max-width:560px){.price-row{grid-template-columns:1fr auto}.record-actions{grid-column:1/-1}.product-head{flex-direction:column}.thumb,.thumb-empty{width:100%;height:220px}.thumb{object-fit:contain}}
</style>
</head>
<body>
<section><h1>我的價格紀錄</h1><div class="version"><div><strong>版本：Step 13.4｜商品管理測試版</strong></div><div>基礎版本：index-step13.3-product-thumbnail-test.html</div><div>本次修改：加入刪除商品、無價格商品管理與圖片管理入口</div><div>相機掃描：未修改</div><div>資料格式：保留 imageUrl、imageSource、records</div></div><button class="primary" id="startCamera">開啟相機掃描</button><button class="secondary hidden" id="stopCamera">關閉相機</button><div id="reader" class="camera hidden"><div id="scanStatus" class="scan-status">請將條碼放入掃描框</div></div><div class="row" style="margin-top:16px"><div><label>商品條碼</label><input id="barcode" inputmode="numeric" placeholder="請輸入或掃描條碼"></div><div style="align-self:end"><button class="primary" id="searchBtn">查詢商品</button></div></div><p id="status" class="muted"></p></section>
<section id="detail" class="hidden"></section><section id="listSection"><h2>已記錄商品</h2><input id="filter" placeholder="搜尋商品名稱或條碼"><div id="list"></div></section><div id="modal" class="modal" hidden><div class="modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://unpkg.com/html5-qrcode"></script><script>
const STORAGE_KEY='price-tracker-products',today=new Date().toISOString().slice(0,10);let products=loadProducts(),activeProduct=null,editingPrice=null,scanner=null,scannerRunning=false;const $=id=>document.getElementById(id);function makeId(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`}function loadProducts(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(d)?d.map(p=>({...p,barcode:String(p.barcode),imageUrl:p.imageUrl||'',imageSource:p.imageSource||'',records:(p.records||[]).map(r=>({...r,id:r.id||makeId(),price:Number(r.price)||0,store:r.store||'',date:r.date||today}))})):[]}catch{return[]}}function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(products))}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function find(c){return products.find(p=>p.barcode===String(c))}function modal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').hidden=false;const i=$('modalBody').querySelector('input');if(i)i.focus()}function closeModal(){$('modal').hidden=true}function thumbnail(p){return p.imageUrl?`<img class="thumb" src="${esc(p.imageUrl)}" alt="${esc(p.name)} 商品圖片" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb-empty',textContent:'商品圖片無法載入'}))">`:`<div class="thumb-empty">尚無商品圖片</div>`}function render(){const q=$('filter').value.trim().toLowerCase(),a=products.filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p class="muted">條碼：${esc(p.barcode)}${p.brand?'｜'+esc(p.brand):''}</p><p>價格紀錄：${p.records.length} 筆</p><div class="actions"><button class="primary" data-open="${esc(p.barcode)}">查看商品</button><button class="danger" data-delete-product="${esc(p.barcode)}">刪除商品</button></div></div>`).join(''):'<p class="muted">目前沒有符合的商品。</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open));document.querySelectorAll('[data-delete-product]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.deleteProduct))}function show(c){const p=find(c);if(!p)return;activeProduct=p;$('listSection').classList.add('hidden');$('detail').classList.remove('hidden');const rs=[...p.records].sort((a,b)=>String(b.date).localeCompare(String(a.date))),min=rs.length?Math.min(...rs.map(r=>Number(r.price))):null;$('detail').innerHTML=`<div class="notice"><div class="product-head"><div class="product-info"><h2>${esc(p.name)}</h2><div>條碼：${esc(p.barcode)}</div>${p.brand?`<div>品牌：${esc(p.brand)}</div>`:''}<p>最近價格：${rs[0]?esc(rs[0].price):'尚無紀錄'}<br>最低價格：${min===null?'尚無紀錄':min.toFixed(2)}</p></div>${thumbnail(p)}</div><div class="actions"><button class="primary" id="add">新增本次價格</button><button class="secondary" id="edit">修改商品</button><button class="danger" id="remove">刪除商品</button><button class="secondary" id="back">返回商品列表</button></div></div><h3>價格紀錄</h3>${rs.map(r=>`<div class="price-row"><div>${esc(r.date)}${r.store?`<div class="muted">店家：${esc(r.store)}</div>`:''}</div><strong>${esc(r.price)}</strong><div class="record-actions"><button class="secondary" data-edit="${esc(r.id)}">修改</button><button class="danger" data-del="${esc(r.id)}">刪除</button></div></div>`).join('')||'<p class="muted">尚無價格紀錄。</p>'}`;$('add').onclick=()=>openPrice(p);$('edit').onclick=()=>openProduct(p);$('remove').onclick=()=>deleteProduct(p.barcode);$('back').onclick=()=>{$('detail').classList.add('hidden');$('listSection').classList.remove('hidden');render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRecord(p,b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteRecord(p,b.dataset.del))}function openProduct(p){modal('修改商品',`<label>商品名稱</label><input id="mName" value="${esc(p.name)}"><label>品牌（選填）</label><input id="mBrand" value="${esc(p.brand||'')}"><label>商品圖片網址（選填）</label><input id="mImage" type="url" value="${esc(p.imageUrl||'')}" placeholder="https://..."><div class="actions"><button class="primary" id="saveM">儲存商品</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=()=>{const n=$('mName').value.trim();if(!n)return alert('請輸入商品名稱');p.name=n;p.brand=$('mBrand').value.trim();p.imageUrl=$('mImage').value.trim();p.imageSource=p.imageUrl?'手動輸入網址':'';save();closeModal();show(p.barcode)};$('cancelM').onclick=closeModal}function openPrice(p){editingPrice=null;activeProduct=p;modal('輸入本次價格',`<label>購買價格</label><input id="mPrice" type="number" min="0" step="0.01"><label>購買地點（選填）</label><input id="mStore"><label>購買日期</label><input id="mDate" type="date" value="${today}"><div class="actions"><button class="primary" id="saveM">儲存價格</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=saveRecord;$('cancelM').onclick=closeModal}function openRecord(p,id){const r=p.records.find(x=>String(x.id)===String(id));if(!r)return;activeProduct=p;editingPrice=r;modal('修改價格紀錄',`<label>購買價格</label><input id="mPrice" type="number" min="0" step="0.01" value="${esc(r.price)}"><label>購買地點（選填）</label><input id="mStore" value="${esc(r.store||'')}"><label>購買日期</label><input id="mDate" type="date" value="${esc(r.date||'')}"><div class="actions"><button class="primary" id="saveM">更新紀錄</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=saveRecord;$('cancelM').onclick=closeModal}function saveRecord(){const v=$('mPrice').value;if(v===''||Number(v)<0)return alert('請輸入正確價格；若暫時不填請按取消');const d={price:Number(v),store:$('mStore').value.trim(),date:$('mDate').value||today};if(editingPrice)Object.assign(editingPrice,d);else activeProduct.records.push({id:makeId(),...d});save();closeModal();show(activeProduct.barcode)}function deleteRecord(p,id){if(!confirm('確定要刪除這筆價格紀錄嗎？'))return;p.records=p.records.filter(r=>String(r.id)!==String(id));save();show(p.barcode)}function deleteProduct(c){const p=find(c);if(!p)return;if(!confirm(`確定要刪除商品「${p.name}」嗎？\n這會一併刪除 ${p.records.length} 筆價格紀錄與商品圖片設定。`))return;products=products.filter(x=>x.barcode!==String(c));save();activeProduct=null;$('detail').classList.add('hidden');$('listSection').classList.remove('hidden');render()}$('searchBtn').onclick=()=>{const c=$('barcode').value.trim();if(!/^\d{8,14}$/.test(c))return alert('請輸入 8 到 14 位數字的條碼。');const p=find(c);if(p)show(c);else openNew(c)};function openNew(c){modal('新增商品',`<label>商品名稱</label><input id="mName"><label>品牌（選填）</label><input id="mBrand"><label>商品圖片網址（選填）</label><input id="mImage" type="url" placeholder="https://..."><div class="actions"><button class="primary" id="saveM">新增商品</button><button class="secondary" id="cancelM">取消</button></div>`);$('saveM').onclick=()=>{const n=$('mName').value.trim();if(!n)return alert('請輸入商品名稱');const p={barcode:String(c),name:n,brand:$('mBrand').value.trim(),imageUrl:$('mImage').value.trim(),imageSource:$('mImage').value.trim()?'手動輸入網址':'',records:[]};products.push(p);save();closeModal();openPrice(p)};$('cancelM').onclick=closeModal}$('filter').oninput=render;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});async function stopScanner(){if(!scanner||!scannerRunning)return;try{await scanner.stop();await scanner.clear()}catch{}scanner=null;scannerRunning=false;$('reader').classList.add('hidden');$('startCamera').classList.remove('hidden');$('stopCamera').classList.add('hidden')}$('startCamera').onclick=async()=>{if(scannerRunning)return;try{scanner=new Html5Qrcode('reader');$('reader').classList.remove('hidden');$('startCamera').classList.add('hidden');$('stopCamera').classList.remove('hidden');$('scanStatus').textContent='請將條碼放入掃描框';scannerRunning=true;await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120},aspectRatio:1.777},async text=>{const code=String(text).trim();$('barcode').value=code;$('status').textContent='已讀取條碼：'+code;await stopScanner();$('searchBtn').click()},()=>{})}catch(e){await stopScanner();$('status').textContent='相機啟動失敗：'+(e.message||'請確認相機權限。');alert('相機啟動失敗，請確認相機權限。')}};$('stopCamera').onclick=stopScanner;render();
</script>
</body>
</html>
