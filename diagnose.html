<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>價格追蹤｜儲存空間診斷</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #263442;
      --muted: #68727d;
      --border: #d8dee6;
      --ok-bg: #ecf9ef;
      --ok-border: #abd9b5;
      --ok-text: #21643b;
      --warn-bg: #fff8e8;
      --warn-border: #efd499;
      --warn-text: #6d5012;
      --code-bg: #19232d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", Arial, sans-serif;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
    }

    h2 {
      margin: 18px 0 10px;
      font-size: 1.1rem;
    }

    p {
      margin: 6px 0;
      line-height: 1.6;
    }

    .notice,
    .card {
      margin: 12px 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
    }

    .notice {
      color: var(--warn-text);
      border-color: var(--warn-border);
      background: var(--warn-bg);
    }

    .ok {
      color: var(--ok-text);
      border-color: var(--ok-border);
      background: var(--ok-bg);
    }

    .muted {
      color: var(--muted);
    }

    .item {
      margin: 10px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    .item strong,
    .item span {
      display: block;
    }

    code,
    pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    pre {
      overflow: auto;
      max-height: 280px;
      margin: 10px 0 0;
      padding: 12px;
      border-radius: 10px;
      color: #dce8ee;
      background: var(--code-bg);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <h1>儲存空間診斷</h1>

  <div class="notice">
    <strong>唯讀頁面：</strong>
    此頁只顯示目前瀏覽器已存在的網站資料，不會新增、修改、刪除、
    同步或還原任何商品、照片與雲端資料。
  </div>

  <section class="card">
    <h2>目前來源</h2>
    <p id="originInfo"></p>
    <p id="pathInfo"></p>
  </section>

  <section class="card">
    <h2>Local Storage</h2>
    <p id="localSummary" class="muted"></p>
    <div id="localResults"></div>
  </section>

  <section class="card">
    <h2>IndexedDB</h2>
    <p id="idbSummary" class="muted"></p>
    <div id="idbResults"></div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function candidateCount(value) {
      if (Array.isArray(value)) return value.length;
      if (!value || typeof value !== "object") return null;

      for (const key of ["products", "items", "data", "list"]) {
        if (Array.isArray(value[key])) return value[key].length;
      }

      if (Array.isArray(value.database?.products)) {
        return value.database.products.length;
      }

      return null;
    }

    function inspectLocalStorage() {
      const keys = Object.keys(localStorage).sort();
      const result = $("localResults");

      $("localSummary").textContent =
        `找到 ${keys.length} 個 localStorage key。`;

      if (!keys.length) {
        result.innerHTML =
          `<div class="item">目前沒有任何 localStorage 資料。</div>`;
        return;
      }

      result.innerHTML = keys
        .map((key) => {
          const raw = localStorage.getItem(key);
          const bytes = new Blob([raw ?? ""]).size;
          let detail = "不是 JSON 或 JSON 解析失敗。";
          let preview = raw ?? "";

          try {
            const parsed = JSON.parse(raw);
            const count = candidateCount(parsed);

            if (count !== null) {
              detail = `JSON 可解析；偵測到候選商品數：${count}。`;
            } else {
              detail = "JSON 可解析；但未偵測到標準商品陣列。";
            }

            preview = JSON.stringify(parsed, null, 2);
          } catch (_) {}

          const isCurrentKey = key === "price-tracker-products";
          const className = isCurrentKey ? "item ok" : "item";

          return `
            <div class="${className}">
              <strong>${escapeHtml(key)}${
                isCurrentKey ? "（目前版本使用）" : ""
              }</strong>
              <span class="muted">大小：${bytes.toLocaleString()} bytes</span>
              <span>${escapeHtml(detail)}</span>
              <pre>${escapeHtml(preview.slice(0, 8000))}</pre>
            </div>
          `;
        })
        .join("");
    }

    async function countStore(dbName, storeName) {
      return new Promise((resolve) => {
        const request = indexedDB.open(dbName);

        request.onerror = () => resolve({ error: "無法開啟資料庫。" });

        request.onsuccess = () => {
          const db = request.result;

          if (!db.objectStoreNames.contains(storeName)) {
            db.close();
            resolve({ error: `找不到 store：${storeName}` });
            return;
          }

          const transaction = db.transaction(storeName, "readonly");
          const countRequest = transaction.objectStore(storeName).count();

          countRequest.onsuccess = () => {
            const count = countRequest.result;
            db.close();
            resolve({ count });
          };

          countRequest.onerror = () => {
            db.close();
            resolve({ error: "無法讀取資料筆數。" });
          };
        };
      });
    }

    async function inspectIndexedDb() {
      const result = $("idbResults");
      const knownDb = "price-tracker-images";
      const knownStore = "images";

      const known = await countStore(knownDb, knownStore);

      let html = `
        <div class="item ${
          typeof known.count === "number" ? "ok" : ""
        }">
          <strong>${knownDb}</strong>
          <span>預期 store：${knownStore}</span>
          <span>${
            typeof known.count === "number"
              ? `目前照片資料筆數：${known.count}。`
              : escapeHtml(known.error)
          }</span>
        </div>
      `;

      if (typeof indexedDB.databases === "function") {
        try {
          const databases = await indexedDB.databases();

          html += `
            <div class="item">
              <strong>瀏覽器可列出的資料庫</strong>
              <pre>${escapeHtml(
                JSON.stringify(
                  databases.map((db) => ({
                    name: db.name,
                    version: db.version,
                  })),
                  null,
                  2,
                ),
              )}</pre>
            </div>
          `;

          $("idbSummary").textContent =
            `已檢查標準照片資料庫，並列出 ${databases.length} 個 IndexedDB 資料庫。`;
        } catch (_) {
          $("idbSummary").textContent =
            "已檢查標準照片資料庫；此瀏覽器無法完整列出其他資料庫。";
        }
      } else {
        $("idbSummary").textContent =
          "已檢查標準照片資料庫；此瀏覽器不支援列出其他資料庫。";
      }

      result.innerHTML = html;
    }

    $("originInfo").textContent = `Origin：${location.origin}`;
    $("pathInfo").textContent = `Path：${location.pathname}`;

    inspectLocalStorage();
    inspectIndexedDb();
  </script>
</body>
</html>
